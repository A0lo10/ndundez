<!DOCTYPE html>
<html data-t="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ndudes Hotel VIP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#eaf1fb;--card:#fff;--tx:#10213d;--mu:#5b6b86;--pri:#1d4ed8;--ln:#dbe5f5;--hd:linear-gradient(120deg,#0b2a6f,#1d4ed8);--ok:#d9f5e3;--okt:#116b36;--er:#fde1e1;--ert:#9b1c1c;--in:#f6f9ff;--sh:0 2px 10px #1d4ed814}
[data-t=dark]{--bg:#081428;--card:#102141;--tx:#e6eeff;--mu:#93a5c8;--pri:#3b82f6;--ln:#1f3560;--hd:linear-gradient(120deg,#050d1d,#0f2a5e);--ok:#12382a;--okt:#7be0a8;--er:#431a1f;--ert:#ff9aa2;--in:#0b1a35;--sh:0 2px 10px #0006}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--tx);transition:background .25s,color .25s}
.mu{color:var(--mu)}h1,h2,h3{margin:.2em 0 .5em}
header{background:var(--hd);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header small{opacity:.7;font-weight:400;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--ln)}
nav button{background:var(--in);color:var(--tx);border:1px solid var(--ln);padding:8px 12px;border-radius:8px;cursor:pointer}nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:16px;max-width:1100px;margin:auto}.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--ln)}
input,select{padding:9px;margin:4px 4px 4px 0;border:1px solid var(--ln);border-radius:8px;font-size:15px;background:var(--in);color:var(--tx);max-width:100%}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}label input,label select{display:block;width:100%;margin:4px 0}
button{font-family:inherit}button.p{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:15px}button.p:hover{filter:brightness(1.1)}
button.s{background:var(--in);color:var(--tx);border:1px solid var(--ln);padding:6px 10px;border-radius:7px;cursor:pointer}button.d{color:var(--ert)}
button:disabled{opacity:.7;cursor:wait}
button.busy{position:relative;color:transparent!important;pointer-events:none}
button.busy::after{content:'';position:absolute;inset:0;margin:auto;width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
button.s.busy::after{border-color:#8883;border-top-color:var(--pri)}@keyframes sp{to{transform:rotate(360deg)}}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.k{background:var(--hd);color:#cfe0ff;border-radius:12px;padding:14px}.k b{display:block;font-size:20px;color:#fff}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:170px;padding-top:18px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.bar i{width:100%;background:linear-gradient(var(--pri),#60a5fa);border-radius:6px 6px 0 0;min-height:2px;transition:height .5s}.bar b{color:var(--tx);font-weight:600;margin-bottom:2px;font-size:11px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--in);border:1px solid var(--ln);margin-left:6px}
.tile{display:flex;gap:12px;padding:14px;border-radius:12px;margin:10px 0;line-height:1.5}.tile>i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:#fff8}
.tile.ok{background:var(--ok);color:var(--okt)}.tile.er{background:var(--er);color:var(--ert)}
#toasts{position:fixed;top:14px;right:14px;z-index:50;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 28px))}
.toast{display:flex;gap:10px;padding:12px 14px;border-radius:12px;box-shadow:0 8px 24px #0004;animation:in .25s;border:1px solid var(--ln)}.toast.ok{background:var(--ok);color:var(--okt)}.toast.er{background:var(--er);color:var(--ert)}
.toast i{font-style:normal;font-weight:700;width:24px;height:24px;border-radius:50%;background:#fff8;display:grid;place-items:center;flex:none}.toast p{margin:2px 0 0;font-size:13px}.toast.out{opacity:0;transition:opacity .5s}@keyframes in{from{transform:translateX(30px);opacity:0}}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:40;padding:14px}.mbox{max-width:420px;width:100%;margin:0}
.ld i{display:block;height:54px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,var(--card),var(--ln),var(--card));background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.hero{background:var(--hd);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:#ffffff12}.hero::before{width:380px;height:380px;right:-120px;top:-120px}.hero::after{width:260px;height:260px;left:-80px;bottom:-80px}
.hero svg{max-width:380px;margin:0 auto 20px;position:relative;filter:drop-shadow(0 18px 24px #0006);animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.hero h1{font-size:34px;margin:0}.hero p{opacity:.8;position:relative;max-width:340px}
.fm{padding:40px;display:flex;flex-direction:column;justify-content:center;max-width:440px;width:100%;margin:auto}.wide{width:100%;margin-top:14px}
.otp{font-size:24px;letter-spacing:10px;text-align:center;width:100%}.lnk{display:block;margin-top:16px;color:var(--pri);cursor:pointer;font-size:14px}.row2{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.sw{position:fixed;right:14px;bottom:14px;z-index:30;cursor:pointer;user-select:none}.sw input{display:none}.sw span{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--ln);box-shadow:var(--sh);font-size:13px}
.sw span::before{content:'☀️ Light'}.sw input:checked+span::before{content:'🌙 Dark blue'}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--in);border:2px solid var(--ln)}
.vc{width:340px;max-width:100%;border-radius:16px;padding:18px;color:#fff;background:linear-gradient(135deg,#7c4a1d,#d08a45);position:relative;overflow:hidden}.vc.t1{background:linear-gradient(135deg,#475569,#94a3b8)}.vc.t2{background:linear-gradient(135deg,#92400e,#f59e0b)}.vc.t3{background:linear-gradient(135deg,#111827,#6366f1)}.vc.t4{background:linear-gradient(135deg,#065f46,#10b981)}.vc.t5{background:linear-gradient(135deg,#9d174d,#ec4899)}
.vc img{float:right;width:70px;height:70px;border-radius:10px;object-fit:cover;border:2px solid #fff6}.vc svg{background:#fff;border-radius:8px;margin-top:10px;max-width:100%}
.pin{cursor:pointer;font-family:monospace}
@media(max-width:760px){.auth{grid-template-columns:1fr}.hero{padding:24px}.hero svg{max-width:220px}}
@page{margin:0}
@media print{body *{visibility:hidden}.pr{padding:14mm!important}.pr,.pr *{visibility:visible}.pr{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0}.vc{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div id="toasts"></div><div id="modal"></div><div id="app"></div>
<label class="sw"><input type="checkbox" id="th" onchange="theme(this.checked)"><span></span></label>
<script>
let T=st('t')||'',ROLE=st('r')||'',CART={},CUST=null,MENU=[],PARTIAL=false,LAST={},CODE='',PIN='',SEL='',MA=[],CA=[],TI=[];
function st(k,v){try{return v===undefined?sessionStorage.getItem(k):v===null?sessionStorage.clear():sessionStorage.setItem(k,v);}catch(e){return '';}}
const $=id=>document.getElementById(id),kes=n=>'KSh '+Number(n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=e=>String(e&&e.message||e).replace(/^Error: /,'');
const API_URL='https://script.google.com/macros/s/AKfycbyzq7YZFbu3YbJ3xLrACLnsxsHfpNQnjxx8WkndcVVvLPtXyvNvfTitOEYvI4frkHIlyg/exec'; // the Apps Script /exec URL
function rpc(a,args){return fetch(API_URL,{method:'POST',body:JSON.stringify({a:a,args:args})}).then(r=>r.json(),()=>{throw 'Cannot reach the server. Check your internet connection.';}).then(j=>{if(!j.ok)throw j.e;return j.d;});}
function run(fn,...a){return rpc('api',[T,fn,a]).catch(e=>{const m=E(e);if(m.includes('SESSION_EXPIRED')){st('x',null);location.reload();}throw m;});}
function call(fn,...a){return rpc(fn,a).catch(e=>{throw E(e);});}
/* ---------- UI helpers ---------- */
function theme(on){if(on===undefined){try{on=localStorage.getItem('th')==='dark';}catch(e){on=false;}}document.documentElement.dataset.t=on?'dark':'light';$('th').checked=on;try{localStorage.setItem('th',on?'dark':'light');}catch(e){}}
function toast(t,type,msg){const d=document.createElement('div');d.className='toast '+(type||'ok');d.innerHTML='<i>'+(type==='er'?'!':'✓')+'</i><div><b>'+esc(t)+'</b>'+(msg?'<p>'+esc(msg)+'</p>':'')+'</div>';$('toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),4500);setTimeout(()=>d.remove(),5000);}
function tile(id,html,good){$(id).innerHTML='<div class="tile '+(good?'ok':'er')+'"><i>'+(good?'✓':'!')+'</i><div>'+html+'</div></div>';}
function ask(title,msg,ph){return new Promise(res=>{$('modal').innerHTML='<div class="ov"><div class="mbox card"><h3>'+title+'</h3><p class="mu">'+msg+'</p>'+(ph?'<input id="ai" placeholder="'+ph+'" style="width:100%">':'')+'<div class="row" style="justify-content:flex-end"><button class="s" onclick="mc(0)">Cancel</button><button class="p" onclick="mc(1)">Confirm</button></div></div></div>';window.mc=ok=>{const v=ph&&$('ai')?$('ai').value.trim():true;$('modal').innerHTML='';res(ok?v:false);};if(ph)$('ai').focus();});}
function modal(html){$('modal').innerHTML='<div class="ov" onclick="if(event.target===this)this.remove()"><div class="mbox card" style="max-width:380px">'+html+'<div class="row noprint" style="justify-content:flex-end"><button class="s" onclick="$(\'modal\').innerHTML=\'\'">Close</button></div></div></div>';}
function go(b,fn){b.classList.add('busy');b.disabled=true;return Promise.resolve().then(fn).catch(e=>toast('Action failed','er',E(e))).finally(()=>{b.classList.remove('busy');b.disabled=false;});}
function table(cols,rows,raw){raw=raw||[];return '<div class="sc"><table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+(rows.length?rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(raw.includes(c)?r[c]:esc(r[c]))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" class="mu">Nothing to show yet.</td></tr>')+'</table></div>';}
function bars(d){const mx=Math.max(1,...d.map(x=>x.v));return '<div class="bars">'+d.map(x=>'<div class="bar"><b>'+(x.v?Number(x.v).toLocaleString():'')+'</b><i style="height:'+Math.round(x.v/mx*100)+'%"></i><span>'+x.d+'</span></div>').join('')+'</div>';}
const dr=()=>'From <input type="date" id="f"> To <input type="date" id="t"> ';
/* ---------- export ---------- */
const stamp=()=>new Date().toISOString().slice(0,10);
function setX(name,title,cols,rows){LAST.x={name:name+'_'+stamp(),title:title,cols:cols,rows:rows};}
function exp(k){const L=LAST.x;if(!L||!L.rows.length)return toast('Nothing to export','er','Load the data first.');
 if(k==='x'){const ws=XLSX.utils.json_to_sheet(L.rows.map(r=>Object.fromEntries(L.cols.map(c=>[c,r[c]==null?'':r[c]]))),{header:L.cols}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Report');XLSX.writeFile(wb,L.name+'.xlsx');}
 else{const d=new jspdf.jsPDF({orientation:L.cols.length>6?'l':'p'});d.setFontSize(14);d.text('NDUDES HOTEL - '+L.title,14,16);d.autoTable({startY:22,head:[L.cols],body:L.rows.map(r=>L.cols.map(c=>String(r[c]==null?'':r[c]))),styles:{fontSize:8},headStyles:{fillColor:[29,78,216]}});d.save(L.name+'.pdf');}
 toast('Download started','ok',L.name);}
const exB='<button class="s" onclick="exp(\'x\')">⬇ Excel</button> <button class="s" onclick="exp(\'p\')">⬇ PDF</button>';
/* ---------- auth ---------- */
function loginView(step){
 const F={
 cred:`<h2>Welcome back</h2><p class="mu">Sign in to manage VIP wallets.</p><label>User code</label><input id="c" placeholder="ADMIN or CASH-001" value="${esc(CODE)}" style="width:100%"><label>Password / PIN</label><input id="p" type="password" placeholder="••••••" style="width:100%"><button class="p wide" onclick="go(this,doLogin)">Continue</button><a class="lnk" onclick="loginView('forgot')">Forgot admin password?</a>`,
 otp:`<h2>Check your email</h2><p class="mu">We sent a 6-digit code to the email registered for <b>${esc(CODE)}</b>.</p><input id="o" class="otp" maxlength="6" inputmode="numeric" placeholder="••••••"><button class="p wide" onclick="go(this,doOtp)">Verify and sign in</button><div class="row2"><button class="s" id="rs" onclick="go(this,resend)">Resend code</button><button class="s" onclick="loginView('cred')">← Back</button></div>`,
 forgot:`<h2>Reset admin password</h2><p class="mu">We'll email a reset code to the admin address saved in Settings.</p><button class="p wide" onclick="go(this,fgSend)">Send reset code</button><a class="lnk" onclick="loginView('cred')">← Back to sign in</a>`,
 reset:`<h2>Set a new password</h2><p class="mu">Enter the code from your email.</p><input id="o" class="otp" maxlength="6" placeholder="Code"><label>New password</label><input id="n1" type="password" style="width:100%"><label>Confirm password</label><input id="n2" type="password" style="width:100%"><button class="p wide" onclick="go(this,fgDo)">Save password</button><a class="lnk" onclick="loginView('cred')">← Back</a>`};
 $('app').innerHTML=`<div class="auth"><div class="hero"><svg viewBox="0 0 320 220"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect x="30" y="50" width="240" height="150" rx="18" fill="#ffffff2a" transform="rotate(-9 150 125)"/><rect x="50" y="30" width="240" height="150" rx="18" fill="url(#g1)"/><rect x="72" y="62" width="40" height="30" rx="6" fill="#ffffff90"/><circle cx="262" cy="60" r="13" fill="#fff9"/><circle cx="248" cy="60" r="13" fill="#fff6"/><text x="72" y="135" font-size="16" fill="#7c2d12" font-family="monospace" letter-spacing="3">VIP-000001</text><text x="72" y="160" font-size="11" fill="#7c2d12">NDUDES HOTEL · GOLD MEMBER</text></svg><h1>Ndudes Hotel</h1><p>VIP wallet. Top up once, pay at the table, and every receipt lands in your inbox.</p></div><div class="fm">${F[step||'cred']}</div></div>`;
 if(step==='otp')cool();setTimeout(()=>{const i=$('c')||$('o');i&&i.focus();},50);}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=document.querySelector('.fm .p');if(b&&!b.disabled)b.click();}});
function doLogin(){CODE=$('c').value.trim();PIN=$('p').value;return call('login',CODE,PIN).then(r=>{if(r.otp){loginView('otp');toast('Code sent','ok','Check the cashier email inbox.');}else{toast('Welcome back','ok','Signed in as admin.');start(r.token,'ADMIN');}});}
function doOtp(){return call('verifyOtp',CODE,$('o').value).then(r=>start(r.token,'CASHIER'));}
let cd;function cool(){let n=30;const b=$('rs');if(!b)return;b.disabled=true;b.textContent='Resend code (30s)';clearInterval(cd);cd=setInterval(()=>{n--;const x=$('rs');if(!x)return clearInterval(cd);if(n<=0){x.disabled=false;x.textContent='Resend code';clearInterval(cd);}else x.textContent='Resend code ('+n+'s)';},1000);}
function resend(){return call('login',CODE,PIN).then(()=>{toast('New code sent','ok','The previous code no longer works.');cool();});}
function fgSend(){return call('adminResetStart').then(()=>{toast('Reset code sent','ok','Check the admin email inbox.');loginView('reset');});}
function fgDo(){if($('n1').value!==$('n2').value)throw 'Passwords do not match';return call('adminResetFinish',$('o').value,$('n1').value).then(()=>{toast('Password updated','ok','Sign in with your new password.');loginView('cred');});}
function start(t,r){T=t;ROLE=r;st('t',t);st('r',r);shell();}
function logout(){st('x',null);location.reload();}
function shell(){const tabs=ROLE==='ADMIN'?['Dashboard','Customers','Wallet','Menu','Cashiers','Sales','Voids','Reports','Audit','Settings']:['Bill','MySales'];
 $('app').innerHTML=`<header><b>NDUDES HOTEL<small>VIP WALLET</small></b><span>${ROLE} <button class="s" onclick="logout()">Logout</button></span></header><nav>${tabs.map(t=>`<button id="t_${t}" onclick="tab('${t}')">${t==='MySales'?'My sales':t}</button>`).join('')}</nav><main id="main"></main>`;tab(tabs[0]);}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));$('t_'+t).classList.add('on');$('main').innerHTML='<div class="ld"><i></i><i></i><i></i></div>';V[t]().catch(e=>toast('Could not load','er',E(e)));}
/* ---------- views ---------- */
const V={
Dashboard(){return run('dash').then(d=>{$('main').innerHTML='<div class="g">'+[['Active VIPs',d.customers],['Wallet funds',kes(d.funds)],["Today's sales",kes(d.sales)],["Today's credits",kes(d.credits)],['Transactions',d.txns],['Low balance',d.low]].map(x=>'<div class="k">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><div class="g2"><div class="card"><h3>Sales, last 7 days (KSh)</h3>'+bars(d.week)+'</div><div class="card"><h3>VIPs by tier</h3>'+bars(d.tiers)+'<p class="mu">Tier is based on total deposited.</p></div></div><div class="card"><button class="s" onclick="go(this,rec)">Run ledger check</button><div id="r"></div></div>';});},
Customers(){return run('customers').then(c=>{LAST.c=c;const rows=c.map(x=>Object.assign({},x,{Balance:kes(x.Balance),Act:'<button class="s" data-id="'+esc(x.ID)+'" onclick="pick(this.dataset.id)">Manage</button>'}));
 $('main').innerHTML='<div class="card"><h3>Register VIP</h3><div class="fr"><label>Full name<input id="n"></label><label>Phone<input id="ph"></label><label>Email<input id="em" type="email"></label><label>Gender<select id="ge"><option>Male</option><option>Female</option></select></label></div><button class="p" onclick="go(this,addC)">Register</button></div><div class="card" id="mg" style="display:none"></div><div class="card">'+table(['ID','Name','Phone','Email','Tier','Status','Balance','Act'],rows,['Act'])+'</div>';});},
Wallet(){$('main').innerHTML='<div class="card"><h3>Credit wallet</h3><div class="fr"><label>Customer ID<input id="id" placeholder="VIP-000001"></label><label>Amount (KSh)<input id="am" type="number"></label><label>Method<select id="me"><option>M-Pesa</option><option>Bank</option><option>Cash</option><option>Cheque</option><option>Other</option></select></label><label>Reference<input id="rf" placeholder="e.g. MPESA-QK82L91"></label></div><button class="p" onclick="go(this,cr)">Credit wallet</button><div id="m"></div></div>';return Promise.resolve();},
Menu(){return run('allMenu').then(m=>{MA=m;$('main').innerHTML='<div class="card"><h3 id="mt">Add menu item</h3><div class="fr"><input id="mid" type="hidden"><label>Name<input id="mn"></label><label>Category<input id="mc"></label><label>Price (KSh)<input id="mp" type="number"></label><label>Available<select id="ma"><option>YES</option><option>NO</option></select></label></div><button class="p" onclick="go(this,si)">Save item</button> <button class="s" onclick="V.Menu()">Clear</button></div><div class="card">'+table(['ID','Name','Category','Price','Active','Act'],m.map(x=>Object.assign({},x,{Act:'<button class="s" data-id="'+x.ID+'" onclick="editI(this.dataset.id)">Edit</button> <button class="s d" data-id="'+x.ID+'" onclick="go(this,()=>delI(this.dataset.id))">Delete</button>'})),['Act'])+'</div>';});},
Cashiers(){return run('cashiers').then(c=>{CA=c;$('main').innerHTML='<div class="card"><h3 id="ct">Add cashier</h3><div class="fr"><input id="cc" type="hidden"><label>Name<input id="cn"></label><label>Email (receives login codes)<input id="ce" type="email"></label><label>PIN<input id="cp" placeholder="leave blank to keep"></label><label>Active<select id="ca"><option>YES</option><option>NO</option></select></label></div><button class="p" onclick="go(this,sc)">Save cashier</button> <button class="s" onclick="V.Cashiers()">Clear</button></div><div class="card">'+table(['Code','Name','Email','Active','PIN','Act'],c.map(x=>Object.assign({},x,{PIN:x.Pin?'<span class="pin" title="Tap to reveal" data-p="'+esc(x.Pin)+'" onclick="this.textContent=this.dataset.p">••••</span>':'<span class="mu">re-save to set</span>',Act:'<button class="s" data-c="'+x.Code+'" onclick="editC(this.dataset.c)">Edit</button>'})),['PIN','Act'])+'<p class="mu">Tap the dots to reveal a PIN.</p></div>';});},
Sales(){$('main').innerHTML='<div class="card">'+dr()+'<button class="p" onclick="go(this,loadSales)">Filter</button> <span id="xb"></span></div><div class="card" id="sl"></div>';return loadSales();},
Voids(){return run('voids').then(v=>{$('main').innerHTML='<div class="card"><h3>Void requests</h3>'+table(['ReqID','Time','SaleID','Cashier','Reason','Status','Act'],v.map(x=>Object.assign({},x,{Act:x.Status==='PENDING'?'<button class="s" data-id="'+x.ReqID+'" onclick="go(this,()=>dv(this.dataset.id,true))">Approve</button> <button class="s d" data-id="'+x.ReqID+'" onclick="go(this,()=>dv(this.dataset.id,false))">Reject</button>':''})),['Act'])+'</div>';});},
Reports(){$('main').innerHTML='<div class="card"><h3>Reports</h3><select id="rt"><option value="sales">Sales</option><option value="credits">Wallet top-ups</option><option value="cashiers">Cashier performance</option><option value="customers">Customers and tiers</option><option value="low">Low-balance customers</option></select> '+dr()+'<button class="p" onclick="go(this,runRep)">Run report</button> <span id="xb"></span></div><div class="card" id="rp"><p class="mu">Choose a report and press Run report.</p></div>';return Promise.resolve();},
Audit(){$('main').innerHTML='<div class="card">'+dr()+'<button class="p" onclick="go(this,loadAudit)">Filter</button> <span id="xb"></span></div><div class="card" id="au"></div>';return loadAudit();},
Settings(){return run('settings').then(s=>{$('main').innerHTML='<div class="card"><h3>System settings</h3><div class="fr"><label>Low-balance alert (KSh)<input id="lb" type="number" value="'+esc(s.LowBalance)+'"></label><label>Partial payments<select id="pt"><option value="NO">No: block if balance is short</option><option value="YES">Yes: take balance, show amount due</option></select></label><label>Admin email (resets and alerts)<input id="ae" type="email" value="'+esc(s.AdminEmail)+'"></label></div><button class="p" onclick="go(this,saveS)">Save settings</button></div><div class="card"><h3>VIP tiers</h3><p class="mu">Set the name and the total deposited (KSh) needed to reach each tier. The lowest tier always starts at 0.</p><div id="tr"></div><button class="s" onclick="addT()">+ Add tier</button> <button class="p" onclick="go(this,saveT)">Save tiers</button></div><div class="card"><h3>Change admin password</h3><div class="fr"><label>Current password<input id="o1" type="password"></label><label>New password<input id="p1" type="password"></label><label>Confirm new password<input id="p2" type="password"></label></div><button class="p" onclick="go(this,chPw)">Change password</button></div>';$('pt').value=s.Partial||'NO';TI=s.Tiers;drawT();});},
Bill(){CART={};CUST=null;return run('menu').then(r=>{MENU=r.items;PARTIAL=r.partial;$('main').innerHTML='<div class="card"><input id="q" placeholder="Scan card or search name / phone" size="28"> <button class="p" onclick="go(this,fc)">Find</button><div id="cu"></div></div><div id="pos"></div><div id="m"></div>';$('q').focus();$('q').onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();fc();}};});},
MySales(){return run('mySales').then(s=>{$('main').innerHTML='<div class="card"><h3>My recent sales</h3>'+table(['SaleID','Time','CustomerID','Total','Paid','Status','Act'],s.map(x=>Object.assign({},x,{Act:x.Status!=='OK'?'':x.Pending?'<span class="mu">Void pending</span>':'<button class="s" data-id="'+x.SaleID+'" onclick="go(this,()=>rv(this.dataset.id))">Request void</button>'})),['Act'])+'</div>';});}
};
/* ---------- admin actions ---------- */
function rec(){return run('reconcile').then(r=>$('r').innerHTML=r.length?table(['ID','Stored','Ledger'],r):'<div class="tile ok"><i>✓</i><div>All balances match the ledger.</div></div>');}
function addC(){return run('addCustomer',{Name:$('n').value,Phone:$('ph').value,Email:$('em').value,Gender:$('ge').value}).then(i=>{toast('VIP registered','ok',i);V.Customers();});}
function pick(id){SEL=id;const c=LAST.c.find(x=>x.ID===id),g=$('mg');g.style.display='block';
 g.innerHTML='<div class="row"><img id="ph_" class="av"><div><h3 style="margin:0">'+esc(c.ID)+' · '+esc(c.Name)+'<span class="badge">'+c.Tier+'</span></h3><span class="mu">Balance '+kes(c.Balance)+'</span></div></div><div class="row"><label style="margin:0">Photo <input type="file" id="pf" accept="image/*" onchange="upPhoto(this)"></label><select id="ss"><option>Active</option><option>Suspended</option><option>Blocked</option></select><button class="p" onclick="go(this,setSt)">Save status</button><button class="s" onclick="go(this,card)">Print VIP card</button></div><div class="row">'+dr()+'<button class="s" onclick="go(this,stmt)">Statement</button><span id="xb"></span></div><div id="st"></div>';
 $('ss').value=c.Status;g.scrollIntoView({behavior:'smooth'});run('photo',id).then(d=>{if(d&&$('ph_'))$('ph_').src=d;});}
function prt(){const t=document.title;document.title=' ';window.onafterprint=()=>{document.title=t;};window.print();}
function setSt(){return run('setStatus',SEL,$('ss').value).then(()=>{toast('Status updated','ok',SEL+' is now '+$('ss').value);});}
function shrink(file,max){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7));};im.onerror=()=>no('Not a valid image');im.src=r.result;};r.readAsDataURL(file);});}
function upPhoto(inp){if(!inp.files[0])return;shrink(inp.files[0],160).then(d=>run('savePhoto',SEL,d).then(()=>{$('ph_').src=d;toast('Photo saved','ok',SEL);})).catch(e=>toast('Photo failed','er',E(e)));}
function stmt(){return run('statement',SEL,$('f').value,$('t').value).then(r=>{const cols=['Time','Description','Type','Amount','Before','After','Reference'];setX('statement_'+SEL,'Statement '+SEL,cols,r);$('st').innerHTML=table(cols,r);$('xb').innerHTML=exB;});}
function card(){const c=LAST.c.find(x=>x.ID===SEL);return run('photo',SEL).then(d=>{modal('<div class="pr"><div class="vc t'+c.TierI+'">'+(d?'<img src="'+d+'">':'')+'<b>NDUDES HOTEL</b><br><small>VIP '+c.Tier.toUpperCase()+' MEMBER</small><h3 style="margin:18px 0 2px">'+esc(c.Name)+'</h3><span style="font-family:monospace;letter-spacing:2px">'+esc(c.ID)+'</span><br><svg id="bc"></svg></div></div><div class="row noprint"><button class="p" onclick="prt()">Print card</button></div>');JsBarcode('#bc',c.ID,{format:'CODE128',height:44,displayValue:false,margin:6});});}
function cr(){return run('credit',$('id').value.trim(),$('am').value,$('me').value,$('rf').value).then(r=>{tile('m','<b>Wallet credited</b><br>'+esc(r.name)+': '+kes(r.before)+' → <b>'+kes(r.after)+'</b><br>Ref '+r.txn+'<br>Email: '+(r.emailSent?'sent ✓':'failed ✗'),1);toast('Wallet credited','ok',kes(r.after)+' new balance');});}
function si(){return run('saveItem',{ID:$('mid').value,Name:$('mn').value,Category:$('mc').value,Price:$('mp').value,Active:$('ma').value}).then(()=>{toast('Menu item saved','ok',$('mn').value);V.Menu();});}
function editI(id){const m=MA.find(x=>x.ID===id);$('mt').textContent='Edit '+m.Name;$('mid').value=m.ID;$('mn').value=m.Name;$('mc').value=m.Category;$('mp').value=m.Price;$('ma').value=m.Active;scrollTo({top:0,behavior:'smooth'});}
function delI(id){const m=MA.find(x=>x.ID===id);return ask('Delete item?','Remove <b>'+esc(m.Name)+'</b> from the menu. Past sales keep their records.').then(ok=>ok&&run('delItem',id).then(()=>{toast('Item deleted','ok',m.Name);V.Menu();}));}
function sc(){return run('saveCashier',{Code:$('cc').value,Name:$('cn').value,Email:$('ce').value,Pin:$('cp').value,Active:$('ca').value}).then(c=>{toast('Cashier saved','ok',c);V.Cashiers();});}
function editC(code){const c=CA.find(x=>x.Code===code);$('ct').textContent='Edit '+c.Code;$('cc').value=c.Code;$('cn').value=c.Name;$('ce').value=c.Email;$('ca').value=c.Active;$('cp').value='';scrollTo({top:0,behavior:'smooth'});}
function loadSales(){const f=$('f')?$('f').value:'',t=$('t')?$('t').value:'';return run('sales',f,t).then(s=>{const cols=['SaleID','Time','CustomerID','Total','Paid','Due','Cashier','Status'];setX('sales','Sales',cols,s);$('xb').innerHTML=exB;$('sl').innerHTML=table(cols.concat('Action'),s.map(x=>Object.assign({},x,{Action:x.Status==='OK'?'<button class="s d" data-id="'+x.SaleID+'" onclick="go(this,()=>vs(this.dataset.id))">Reverse</button>':''})),['Action']);});}
function vs(id){return ask('Reverse sale?','Refund <b>'+id+'</b> to the customer wallet.').then(ok=>ok&&run('voidSale',id).then(()=>{toast('Sale reversed','ok',id);loadSales();}));}
function dv(id,ok){return run('decideVoid',id,ok).then(()=>{toast(ok?'Void approved':'Void rejected','ok',id);V.Voids();});}
function runRep(){const ty=$('rt').value;return run('report',ty,$('f').value,$('t').value).then(r=>{setX('report_'+ty,$('rt').selectedOptions[0].text,r.cols,r.rows);$('rp').innerHTML=table(r.cols,r.rows);$('xb').innerHTML=exB;});}
function loadAudit(){return run('audit',$('f').value,$('t').value).then(a=>{const cols=['Time','User','Action'];setX('audit','Audit log',cols,a);$('xb').innerHTML=exB;$('au').innerHTML=table(cols,a);});}
function saveS(){return run('saveSettings',{LowBalance:$('lb').value,Partial:$('pt').value,AdminEmail:$('ae').value}).then(()=>toast('Settings saved','ok'));}
function readT(){return [...document.querySelectorAll('.trow')].map(r=>({name:r.querySelector('.tn').value,min:r.querySelector('.tm').value}));}
function drawT(){$('tr').innerHTML=TI.map((t,i)=>'<div class="row trow"><input class="tn" placeholder="Tier name" value="'+esc(t.name)+'"><input class="tm" type="number" min="0" placeholder="Min deposited" value="'+esc(t.min)+'"'+(i===0?' title="Lowest tier starts at 0"':'')+'><button class="s d" data-i="'+i+'" onclick="delT(this.dataset.i)">Remove</button></div>').join('');}
function addT(){TI=readT();if(TI.length>=6)return toast('Limit reached','er','Up to 6 tiers.');TI.push({name:'',min:''});drawT();}
function delT(i){TI=readT();if(TI.length<=2)return toast('Keep at least 2 tiers','er');TI.splice(i,1);drawT();}
function saveT(){TI=readT();return run('saveSettings',{LowBalance:$('lb').value,Partial:$('pt').value,AdminEmail:$('ae').value,Tiers:TI}).then(()=>{toast('Tiers saved','ok','Cards, badges and the dashboard now use them.');V.Settings();});}
function chPw(){if($('p1').value!==$('p2').value)throw 'New passwords do not match';return run('changePassword',$('o1').value,$('p1').value).then(()=>{toast('Password changed','ok','A notice was emailed to the admin address.');['o1','p1','p2'].forEach(i=>$(i).value='');});}
/* ---------- cashier ---------- */
function rv(id){return ask('Request void','Tell the admin why <b>'+id+'</b> should be reversed.','Reason').then(r=>{if(r===false)return;if(!r)throw 'A reason is required';return run('requestVoid',id,r).then(()=>{toast('Request sent','ok','Waiting for admin approval.');V.MySales();});});}
function fc(){const q=$('q').value.trim();if(!q)return;return run('find',q).then(r=>{if(!r.length)return tile('cu','No customer found for "'+esc(q)+'".');
 const ex=r.find(x=>x.ID.toLowerCase()===q.toLowerCase());if(r.length>1&&!ex){CA=r;$('cu').innerHTML='<p class="mu">Pick a customer:</p>'+r.map((x,i)=>'<button class="s" style="margin:3px" onclick="sel('+i+')">'+esc(x.Name)+' · '+esc(x.ID)+'</button>').join('');return;}
 setC(ex||r[0]);});}
function sel(i){setC(CA[i]);}
function setC(c){CUST=c;$('cu').innerHTML='<div class="row"><img id="ph_" class="av"><div><h3 style="margin:0">'+esc(c.ID)+' · '+esc(c.Name)+'<span class="badge">'+c.Tier+'</span></h3>Status: '+esc(c.Status)+' · Wallet: <b>'+kes(c.Balance)+'</b></div></div>';run('photo',c.ID).then(d=>{if(d&&$('ph_'))$('ph_').src=d;});pos();}
function pos(){CART={};$('m').innerHTML='';$('pos').innerHTML='<div class="card">'+MENU.map(m=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)"><span>'+esc(m.Name)+' <small class="mu">('+esc(m.Category)+')</small> · '+kes(m.Price)+'</span><span><button class="s" data-id="'+m.ID+'" onclick="ch(this.dataset.id,-1)">−</button> <b id="q_'+m.ID+'">0</b> <button class="s" data-id="'+m.ID+'" onclick="ch(this.dataset.id,1)">+</button></span></div>').join('')+'<h3>Total: <span id="tot">KSh 0</span></h3>'+(PARTIAL?'<p class="mu">Partial payment is on: if the wallet is short, its balance is used and the rest is shown as due.</p>':'')+'<button class="p" onclick="go(this,pay)">Pay from wallet</button></div>';}
function ch(id,d){CART[id]=Math.max(0,(CART[id]||0)+d);$('q_'+id).textContent=CART[id];$('tot').textContent=kes(MENU.reduce((a,m)=>a+m.Price*(CART[m.ID]||0),0));}
function pay(){const items=Object.keys(CART).filter(k=>CART[k]>0).map(k=>({id:k,qty:CART[k]}));if(!items.length)throw 'Add at least one item';
 const tot=MENU.reduce((a,m)=>a+m.Price*(CART[m.ID]||0),0);
 return ask('Confirm payment','Charge <b>'+kes(tot)+'</b> to '+esc(CUST.Name)+'?').then(ok=>ok&&run('charge',CUST.ID,items).then(r=>{$('pos').innerHTML='';$('cu').innerHTML='';
 $('m').innerHTML='<div class="card pr"><h3>NDUDES HOTEL – RECEIPT</h3>'+esc(r.customer)+' ('+esc(CUST.ID)+')<br>'+r.time+table(['Item','Qty','Total'],r.lines.map(l=>({Item:l.n,Qty:l.q,Total:l.p*l.q})))+'<h3>Total '+kes(r.total)+'</h3>'+(r.due>0?'Paid from wallet '+kes(r.paid)+'<br><b>Balance due '+kes(r.due)+'</b><br>':'')+'Before '+kes(r.before)+' · Balance <b>'+kes(r.after)+'</b><br>'+r.txn+'<br>Email: '+(r.emailSent?'sent ✓':'failed ✗')+'<div class="row noprint"><button class="p" onclick="prt()">Print</button><button class="s" onclick="V.Bill()">New bill</button></div></div>';toast('Payment received','ok',kes(r.paid)+' from wallet');}));}
theme();T?shell():loginView();
</script></body></html>
